plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.2.0-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.jaimenafer'
version = '0.0.1-SNAPSHOT'

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.apache.poi:poi-ooxml:6.0.0'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

jacoco {
	toolVersion = '0.8.16'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Verifica a aplicação com MySQL descartável (requer Docker).'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter test
}

tasks.named('check') {
	dependsOn integrationTest
	dependsOn jacocoTestCoverageVerification
}

def regrasImportacao = ['**/operacoes/domain/service/MotorLivro.class',
	'**/operacoes/domain/service/AgrupamentoNegociacoes.class',
	'**/operacoes/domain/service/ProjecaoGrupo.class',
	'**/importacoes/infrastructure/csv/LeitorRelatorioBinance.class',
	'**/importacoes/infrastructure/arquivos/*.class',
	'**/importacoes/application/mapper/*.class']

tasks.named('jacocoTestReport') {
	dependsOn test, integrationTest
	executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'), layout.buildDirectory.file('jacoco/integrationTest.exec'))
	classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching { include regrasImportacao })
	reports { xml.required = true }
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn jacocoTestReport
	executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'), layout.buildDirectory.file('jacoco/integrationTest.exec'))
	classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching { include regrasImportacao })
	violationRules {
		rule {
			limit { counter = 'LINE'; minimum = 0.90 }
			limit { counter = 'BRANCH'; minimum = 0.85 }
		}
	}
}

tasks.register('localTestRun', JavaExec) {
	description = 'Inicia a aplicação com MySQL descartável; os dados não são persistidos entre execuções.'
	group = 'application'
	dependsOn integrationTestClasses
	classpath = sourceSets.integrationTest.runtimeClasspath
	mainClass = 'io.github.jaimenafer.lastro.TestLocalApplication'
}

tasks.register('copyFrontend', Copy) {
	from '../frontend/dist'
	into layout.buildDirectory.dir('frontend-static/static')
	doFirst {
		if (!file('../frontend/dist/index.html').isFile()) {
			throw new GradleException('Execute npm ci e npm run build em frontend antes de empacotar com -PincludeFrontend.')
		}
	}
}

if (providers.gradleProperty('includeFrontend').isPresent()) {
	sourceSets.main.resources.srcDir layout.buildDirectory.dir('frontend-static')
	tasks.named('processResources') { dependsOn copyFrontend }
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
