spring.application.name=Lastro
spring.config.import=optional:file:${LASTRO_CONFIG_PATH:../.local/mysql.properties}
server.address=127.0.0.1
server.port=${LASTRO_PORT:8080}
spring.datasource.url=${LASTRO_DB_URL:${lastro.database.url:jdbc:mysql://127.0.0.1:3306/lastro_local?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}}
spring.datasource.username=${LASTRO_DB_USER:${lastro.database.username:lastro_app}}
spring.datasource.password=${LASTRO_DB_PASSWORD:${lastro.database.password:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never
