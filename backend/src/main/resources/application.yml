spring:
  application:
    name: Lastro
  config:
    import: "optional:file:${LASTRO_CONFIG_PATH:../.local/mysql.properties}"
  datasource:
    url: "${LASTRO_DB_URL:${lastro.database.url:jdbc:mysql://127.0.0.1:3306/lastro_local?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}}"
    username: "${LASTRO_DB_USER:${lastro.database.username:lastro_app}}"
    password: "${LASTRO_DB_PASSWORD:${lastro.database.password:}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  port: ${LASTRO_PORT:8080}
