spring:
  application:
    name: Lastro
  config:
    import: "optional:file:${LASTRO_CONFIG_PATH:../.local/mysql.properties}"
  datasource:
    url: "${LASTRO_DB_URL:${lastro.database.url:jdbc:mysql://127.0.0.1:3306/lastro_local?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}}"
    username: "${LASTRO_DB_USER:${lastro.database.username:lastro_app}}"
    password: "${LASTRO_DB_PASSWORD:${lastro.database.password:}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${LASTRO_IMPORTACAO_MAX_ARQUIVO:10MB}
      max-request-size: ${LASTRO_IMPORTACAO_MAX_REQUISICAO:11MB}
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  port: ${LASTRO_PORT:8080}

lastro:
  importacoes:
    max-bytes: ${LASTRO_IMPORTACAO_MAX_BYTES:10485760}
    max-eventos: ${LASTRO_IMPORTACAO_MAX_EVENTOS:5000}

  conferencia:
    max-bytes: ${LASTRO_CONFERENCIA_MAX_BYTES:10485760}
    max-registros: ${LASTRO_CONFERENCIA_MAX_REGISTROS:10000}
    max-descompactados: ${LASTRO_CONFERENCIA_MAX_DESCOMPACTADOS:104857600}

  conciliacao:
    janela-associacao: ${LASTRO_JANELA_ASSOCIACAO:2s}
